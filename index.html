<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGAH Archive</title>
<style>
:root{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --text:#e8e8e8;--text2:#999;--text3:#555;
  --border:#3a3a3a;--border2:#2a2a2a;
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --blue:#378ADD;--blue-light:#7EB8FF;--blue-bg:#0C2440;
  --green:#2EAB6A;--green-bg:#173404;
  --orange:#FF9A7C;--orange-bg:#3A2008;
  --red:#FF8080;--red-bg:#3A1208;
  --gray-bg:#2e2e2e;
}
*{box-sizing:border-box}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);margin:0;padding-bottom:60px}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px}
.topbar{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:0.5px solid var(--border);padding:16px;text-align:center}
.topbar h1{font-size:16px;font-weight:500;margin:0 0 12px;color:var(--text)}
.mode-toggle{display:flex;gap:8px;justify-content:center}
.mode-btn{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font)}
.mode-btn.active{background:var(--blue-bg);color:var(--blue-light);border-color:var(--blue)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
select{background:var(--bg2);color:var(--text);border:0.5px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:12px;font-family:var(--font)}
.match-list{display:flex;flex-direction:column;gap:6px}
.match-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:var(--radius);padding:12px 14px;cursor:pointer;border:0.5px solid transparent;gap:12px}
.match-row:hover{border-color:var(--border)}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.season-pill{font-size:10px;padding:2px 8px;border-radius:var(--radius);white-space:nowrap;font-weight:500}
.pill-winter{background:var(--blue-bg);color:var(--blue-light)}
.pill-spring{background:var(--green-bg);color:var(--green)}
.pill-fall{background:var(--orange-bg);color:var(--orange)}
.match-row .opp{font-size:14px;color:var(--text)}
.match-row .meta{font-size:11px;color:var(--text2)}
.badge{font-size:12px;padding:4px 12px;border-radius:var(--radius);white-space:nowrap;font-weight:500;flex-shrink:0}
.badge-w{background:var(--green-bg);color:var(--green)}
.badge-l{background:var(--red-bg);color:var(--red)}
.badge-t{background:var(--gray-bg);color:var(--text2)}
.badge-upcoming{background:var(--bg3);color:var(--text3);border:0.5px solid var(--border)}
.season-header{margin-bottom:16px}
.season-header .title-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.season-header h2{font-size:20px;font-weight:500;margin:0;color:var(--text)}
.season-header .sub{font-size:12px;color:var(--text2)}
.record{font-size:12px;color:var(--text2);margin-bottom:16px}
.record b{color:var(--text)}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--blue-light);cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:var(--font)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.detail-header h2{font-size:18px;font-weight:500;margin:0 0 4px;color:var(--text)}
.detail-header .meta{font-size:12px;color:var(--text2);line-height:1.6}
.video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.no-video{background:var(--bg2);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text3);font-size:12px;margin-bottom:16px}
.empty-note{background:var(--bg2);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:12px;margin-bottom:16px}
.section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:10px;text-align:center}
.stat-card .label{font-size:10px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:16px;font-weight:500;color:var(--text)}
.roster{font-size:13px;color:var(--text);line-height:1.8}
.roster .subs{color:var(--text2);font-size:12px}
.empty{color:var(--text3);font-size:12px;padding:24px 0;text-align:center}
.butterfly-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}
.butterfly-row .bar-wrap{display:flex;align-items:center;height:16px}
.butterfly-row .bar{height:6px;border-radius:3px}
.butterfly-row .us .bar{background:var(--blue);margin-left:auto}
.butterfly-row .them .bar{background:var(--text3)}
.butterfly-row .us{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.butterfly-row .them{display:flex;justify-content:flex-start;align-items:center;gap:8px}
.butterfly-row .val{font-size:12px;font-weight:500;color:var(--text);min-width:22px;text-align:center}
.butterfly-row .stat-label{font-size:10px;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.03em}
.stats-legend{display:flex;justify-content:center;gap:20px;font-size:11px;color:var(--text2);margin-bottom:12px}
.stats-legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%}
.dot-us{background:var(--blue)}
.dot-them{background:var(--text3)}
.box-score{width:100%;border-collapse:collapse;margin-bottom:16px}
.box-score th{font-size:10px;color:var(--text3);font-weight:500;text-align:center;padding:6px 4px;text-transform:uppercase;letter-spacing:.03em}
.box-score th.team-col{text-align:left}
.box-score th.final-col{border-left:1px solid var(--border)}
.box-score td{font-size:14px;color:var(--text);text-align:center;padding:8px 4px;border-top:0.5px solid var(--border2)}
.box-score td.team-name{text-align:left;font-size:13px;color:var(--text2)}
.box-score td.final-col{border-left:1px solid var(--border);font-weight:500}
.box-score td.set-won{color:var(--green);font-weight:500}
.box-score tr.winner td.team-name{color:var(--text)}
.box-score tr.winner td.final-col{color:var(--green)}
.box-score td.set-empty{color:var(--text3)}
.ksv-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--blue-light);background:var(--blue-bg);border:0.5px solid var(--blue);border-radius:var(--radius);padding:8px 14px;margin-top:8px;cursor:pointer}
.err-butterfly{width:100%}
.err-bf-header{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;margin-bottom:8px}
.err-bf-head-left{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#7EB8FF;text-align:right}
.err-bf-head-center{font-size:11px;color:var(--text3);text-align:center}
.err-bf-head-right{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#FF9A7E;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-bf-row{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;align-items:center;margin-bottom:6px}
.err-bf-bar-left{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.err-bf-bar-right{display:flex;justify-content:flex-start;align-items:center;gap:4px}
.err-bf-label{font-size:11px;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.err-bf-fill{height:12px;border-radius:2px;min-width:1px}
.err-bf-val{font-size:12px;font-weight:500;color:var(--text2);flex-shrink:0;min-width:16px}
</style>
</head>

    <button class="mode-btn" id="btn-season" onclick="goCurrentSeason()">Single Season</button>
  </div>
</div>

l, "subs": null, "sw": null, "sl": null, "result": null, "video": null, "stats": null, "setScores": null, "ksvImport": null}];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SEASON_PILL_CLASS = {Winter:'pill-winter', Spring:'pill-spring', Fall:'pill-fall'};
const OUR_TEAM_NAME = 'WGAH';
// Both files are deployed together — relative path to the tracker in the same folder
const KSV_TRACKER_URL = 'ksv_statTracker.html';

function parseDate(d){
  if(!d) return null;
  const [m,day,y] = d.split('/').map(Number);
  const fullY = y < 100 ? 2000+y : y;
  return new Date(fullY, m-1, day);
}
function shortDate(d){
  const dt = parseDate(d);
  if(!dt) return '';
  return MONTHS[dt.getMonth()]+' '+dt.getDate();
}
function seasonKey(m){ return m.year+'-'+m.season; }
function cap(s){ return s.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }

// distinct seasons in chronological (file) order
const seasonOrder = [];
MATCHES.forEach(m=>{
  const k = seasonKey(m);
  if(!seasonOrder.includes(k)) seasonOrder.push(k);
});
const currentSeasonKey = seasonOrder[seasonOrder.length-1];

function ytEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{6,})/);
  return m ? 'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0' : null;
}

function seasonPill(m){
  const cls = SEASON_PILL_CLASS[m.season] || 'pill-winter';
  return '<span class="season-pill '+cls+'">'+m.season+' '+m.year+'</span>';
}

function badge(m){
  if(!m.result) return '<span class="badge badge-upcoming">Upcoming</span>';
  const cls = m.result==='W' ? 'badge-w' : (m.result==='L' ? 'badge-l' : 'badge-t');
  const score = (m.sw!=null && m.sl!=null) ? (m.result+' '+m.sw+'-'+m.sl) : m.result;
  return '<span class="badge '+cls+'">'+score+'</span>';
}

function matchRow(m){
  const label = m.opponent ? ('vs '+m.opponent) : 'TBD';
  const metaParts = [];
  if(m.week) metaParts.push('Week '+m.week);
  if(m.type) metaParts.push(m.type);
  if(m.date) metaParts.push(shortDate(m.date));
  if(m.location) metaParts.push(m.location);
  if(!m.result && m.time) metaParts.push(m.time);
  return '<div class="match-row" onclick="goMatch(\''+m.id+'\')">'
    + '<div>'
    + '<div class="row-top">'+seasonPill(m)+'<span class="opp">'+label+'</span></div>'
    + '<div class="meta">'+metaParts.join(' \u00b7 ')+'</div>'
    + '</div>'
    + badge(m)
    + '</div>';
}

function router(){
  const hash = location.hash || '#/matches';
  const app = document.getElementById('app');
  document.getElementById('btn-all').classList.remove('active');
  document.getElementById('btn-season').classList.remove('active');

  if(hash.startsWith('#/match/')){
    renderMatch(app, decodeURIComponent(hash.slice(8)));
  } else if(hash.startsWith('#/season/')){
    document.getElementById('btn-season').classList.add('active');
    renderSeason(app, decodeURIComponent(hash.slice(9)));
  } else {
    document.getElementById('btn-all').classList.add('active');
    renderAllSeasons(app);
  }
  window.scrollTo(0,0);
}

function goAllSeasons(){ location.hash = '#/matches'; }
function goCurrentSeason(){ location.hash = '#/season/'+encodeURIComponent(currentSeasonKey); }
function goMatch(id){ location.hash = '#/match/'+encodeURIComponent(id); }

function renderAllSeasons(app){
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const fYear = params.get('year') || '';
  const fSeason = params.get('season') || '';

  const years = [...new Set(MATCHES.map(m=>m.year))].sort();
  const seasons = [...new Set(MATCHES.map(m=>m.season))];

  let list = MATCHES.slice().reverse();
  if(fYear) list = list.filter(m=>m.year===fYear);
  if(fSeason) list = list.filter(m=>m.season===fSeason);

  app.innerHTML = ''
    + '<div class="filters">'
    + '<select onchange="setFilter(\'year\', this.value)"><option value="">All years</option>'
      + years.map(y=>'<option value="'+y+'"'+(y===fYear?' selected':'')+'>'+y+'</option>').join('')
    + '</select>'
    + '<select onchange="setFilter(\'season\', this.value)"><option value="">All seasons</option>'
      + seasons.map(s=>'<option value="'+s+'"'+(s===fSeason?' selected':'')+'>'+s+'</option>').join('')
    + '</select>'
    + '</div>'
    + '<div class="match-list">'
    + (list.length ? list.map(matchRow).join('') : '<div class="empty">No matches match these filters.</div>')
    + '</div>';
}

function setFilter(key, val){
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  if(val) params.set(key, val); else params.delete(key);
  const qs = params.toString();
  location.hash = '#/matches' + (qs ? '?'+qs : '');
}

function renderSeason(app, key){
  const [year, season] = key.split('-');
  const list = MATCHES.filter(m=>m.year===year && m.season===season);
  const divisions = [];
  list.forEach(m=>{ if(m.division && !divisions.includes(m.division)) divisions.push(m.division); });
  const division = divisions.join(' \u2192 ');

  const played = list.filter(m=>m.result);
  const w = played.filter(m=>m.result==='W').length;
  const l = played.filter(m=>m.result==='L').length;
  const t = played.filter(m=>m.result==='T').length;
  const record = played.length ? (w+'-'+l+(t?'-'+t:'')) : 'No games played yet';

  app.innerHTML = ''
    + '<div class="season-header">'
    + '<div class="title-row"><h2>'+season+' '+year+'</h2>'
    + '<select onchange="location.hash=\'#/season/\'+encodeURIComponent(this.value)">'
      + seasonOrder.slice().reverse().map(k=>'<option value="'+k+'"'+(k===key?' selected':'')+'>'+k.split('-')[1]+' '+k.split('-')[0]+'</option>').join('')
    + '</select></div>'
    + (division ? '<div class="sub">'+division+'</div>' : '')
    + '</div>'
    + '<div class="record">Record: <b>'+record+'</b></div>'
    + '<div class="match-list">'
    + (list.length ? list.map(matchRow).join('') : '<div class="empty">No matches in this season.</div>')
    + '</div>';
}

function boxScoreHtml(m){
  if(!m.setScores || !m.setScores.length){
    return '<div class="empty-note">No set scores available</div>';
  }
  const numCols = Math.max(5, m.setScores.length);
  const usWonCount = m.setScores.filter(s=>s[0]>s[1]).length;
  const themWonCount = m.setScores.filter(s=>s[1]>s[0]).length;
  const usIsWinner = usWonCount > themWonCount;

  const header = '<tr><th class="team-col"></th>'
    + Array.from({length:numCols},(_,i)=>'<th>'+(i+1)+'</th>').join('')
    + '<th class="final-col">Final</th></tr>';

  function cell(val, won){
    if(val==null) return '<td class="set-empty">\u2013</td>';
    return '<td'+(won?' class="set-won"':'')+'>'+val+'</td>';
  }

  const usCells = Array.from({length:numCols},(_,i)=>{
    const s = m.setScores[i];
    return s ? cell(s[0], s[0]>s[1]) : cell(null);
  }).join('');
  const themCells = Array.from({length:numCols},(_,i)=>{
    const s = m.setScores[i];
    return s ? cell(s[1], s[1]>s[0]) : cell(null);
  }).join('');

  const usRow = '<tr'+(usIsWinner?' class="winner"':'')+'><td class="team-name">WGAH</td>'+usCells+'<td class="final-col">'+usWonCount+'</td></tr>';
  const themRow = '<tr'+(!usIsWinner?' class="winner"':'')+'><td class="team-name">'+(m.opponent||'Opponent')+'</td>'+themCells+'<td class="final-col">'+themWonCount+'</td></tr>';

  return '<table class="box-score"><thead>'+header+'</thead><tbody>'+usRow+themRow+'</tbody></table>';
}

function ksvTrackerLink(m){
  if(!m.ksvImport || !KSV_TRACKER_URL) return '';
  const url = KSV_TRACKER_URL + '#/import?my=' + encodeURIComponent(OUR_TEAM_NAME)
    + '&opp=' + encodeURIComponent(m.opponent || 'Opponent')
    + '&data=' + encodeURIComponent(m.ksvImport);
  return '<a class="ksv-link" href="'+url+'" target="_blank" rel="noopener">Full Stats \u2197</a>';
}

function statsHtml(m){
  if(!m.stats){
    return '<div class="section-title">Match stats</div><div class="empty-note">Stats not available</div>';
  }
  const s = m.stats;
  const cats = [
    {label:'Attack (kill)', mine: s.attacks, theirs: s.oppAttacks, color:'#378ADD'},
    {label:'Block', mine: s.blocks, theirs: s.oppBlocks, color:'#E8C319'},
    {label:'Serve (ace)', mine: s.serves, theirs: s.oppServes, color:'#2EAB6A'},
    {label:'Opponent errors', mine: s.oppErrors, theirs: s.ourErrors, color:'#E24B4A'}
  ];
  const maxVal = Math.max(1, ...cats.flatMap(c=>[c.mine||0, c.theirs||0]));

  const header = '<div class="err-bf-header">'
    + '<div class="err-bf-head-left">'+OUR_TEAM_NAME+'</div>'
    + '<div class="err-bf-head-center"></div>'
    + '<div class="err-bf-head-right">'+(m.opponent||'Opponent')+'</div>'
    + '</div>';

  const rows = cats.map(c=>{
    const mv = c.mine!=null ? c.mine : 0;
    const ov = c.theirs!=null ? c.theirs : 0;
    const mPct = Math.round(mv/maxVal*100);
    const oPct = Math.round(ov/maxVal*100);
    return '<div class="err-bf-row">'
      + '<div class="err-bf-bar-left"><div class="err-bf-fill" style="width:'+mPct+'%;background:'+c.color+'"></div><span class="err-bf-val" style="color:'+c.color+'">'+mv+'</span></div>'
      + '<div class="err-bf-label">'+c.label+'</div>'
      + '<div class="err-bf-bar-right"><span class="err-bf-val" style="color:'+c.color+'">'+ov+'</span><div class="err-bf-fill" style="width:'+oPct+'%;background:'+c.color+'"></div></div>'
      + '</div>';
  }).join('');

  const totalRow = '<div class="err-bf-row" style="border-top:0.5px solid var(--border2);margin-top:4px;padding-top:8px">'
    + '<div class="err-bf-bar-left"><span class="err-bf-val" style="color:var(--text)">'+(s.points!=null?s.points:'\u2013')+'</span></div>'
    + '<div class="err-bf-label" style="color:var(--text2)">Total</div>'
    + '<div class="err-bf-bar-right"><span class="err-bf-val" style="color:var(--text)">'+(s.oppPoints!=null?s.oppPoints:'\u2013')+'</span></div>'
    + '</div>';

  return '<div class="section-title">Match stats</div>'
    + '<div class="err-butterfly">' + header + rows + totalRow + '</div>'
    + ksvTrackerLink(m);
}

function renderMatch(app, id){
  const m = MATCHES.find(x=>x.id===id);
  if(!m){ app.innerHTML = '<div class="empty">Match not found.</div>'; return; }

  const meta = [m.type, m.season+' '+m.year, 'Week '+m.week].filter(Boolean).join(' \u00b7 ');
  const meta2 = [m.location, m.date, m.time].filter(Boolean).join(' \u00b7 ');
  const embed = ytEmbed(m.video);

  let rosterHtml = '';
  if(m.lineup || m.subs){
    rosterHtml = '<div class="section-title">Lineup</div><div class="roster">'
      + (m.lineup ? '<div>'+cap(m.lineup.split(',').map(s=>s.trim()).join(', '))+'</div>' : '')
      + (m.subs ? '<div class="subs">Subs: '+cap(m.subs.split(',').map(s=>s.trim()).join(', '))+'</div>' : '')
      + '</div>';
  }

  app.innerHTML = ''
    + '<button class="back-link" onclick="history.back()">&larr; Back</button>'
    + '<div class="detail-header">'
    + '<div><h2>'+(m.opponent?('vs '+m.opponent):'TBD')+'</h2>'
    + '<div class="meta">'+meta+'<br>'+meta2+'</div></div>'
    + badge(m)
    + '</div>'
    + (embed
        ? '<div class="video-wrap"><iframe src="'+embed+'" allowfullscreen></iframe></div>'
        : '<div class="no-video">No video available for this match</div>')
    + boxScoreHtml(m)
    + statsHtml(m)
    + rosterHtml;
}

window.addEventListener('hashchange', router);
router();
</script>
